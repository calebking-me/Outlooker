# Runs Outlooker.py on GitHub's servers, so no computer of yours has
# to stay on.
#
# Settings: outlooker.actions.ini in this repository (counties, hail, wind, lowered
# risk messages and so on). Edit it and commit; the next run uses it.
# Secrets (repository Settings > Secrets and variables > Actions), never in that file:
#   SLACK_ALERTS_WEBHOOK_URL   the alerts channel webhook (required)
#   SLACK_LOGS_WEBHOOK_URL     the logs channel webhook (optional; when set, every run
#                              posts its full output there)
#   OUTLOOKER_HEARTBEAT_URL    requested after every run, for a monitoring service
#                              such as healthchecks.io (optional)
#   OUTLOOKER_FAILURE_URL      requested when a run has a problem (optional)
#   SLACK_BOT_TOKEN            Slack app bot token, for check-duplicates (optional)
#
# Schedules only run from the default branch (main). Run it by hand from the Actions
# tab with "Run workflow"; choose test-webhook first to check both channels.
name: Outlooker

on:
  schedule:
    - cron: "38 * * * *"  # Every hour, 38 minutes past the hour. This is to increase the change that GitHub actions actually works. 
  workflow_dispatch:
    inputs:
      mode:
        description: What to run
        type: choice
        default: check
        options: [check, test-webhook, test-alert, test-heartbeat, dry-run]

permissions:
  contents: read

# Never let two runs overlap: they would race on the state file.
concurrency:
  group: outlooker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The state file (what has already been alerted) and the county outline are
      # carried from run to run in GitHub's cache. Without the state file every run
      # would repeat the same alert.
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: |
            spc_county_alert_state_*.json
            county_*.geojson
          key: outlooker-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: outlooker-state-

      - name: Check SPC outlooks
        env:
          SLACK_ALERTS_WEBHOOK_URL: ${{ secrets.SLACK_ALERTS_WEBHOOK_URL }}
          SLACK_LOGS_WEBHOOK_URL: ${{ secrets.SLACK_LOGS_WEBHOOK_URL }}
          OUTLOOKER_HEARTBEAT_URL: ${{ secrets.OUTLOOKER_HEARTBEAT_URL }}
          OUTLOOKER_FAILURE_URL: ${{ secrets.OUTLOOKER_FAILURE_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          MODE: ${{ inputs.mode || 'check' }}
        run: |
          case "$MODE" in
            check)          python3 Outlooker.py --config outlooker.actions.ini ;;
            test-webhook)   python3 Outlooker.py --config outlooker.actions.ini --test-webhook ;;
            test-alert)     python3 Outlooker.py --config outlooker.actions.ini --test-alert ;;
            test-heartbeat) python3 Outlooker.py --config outlooker.actions.ini --test-heartbeat ;;
            dry-run)        python3 Outlooker.py --config outlooker.actions.ini --dry-run ;;
          esac

      # Saved even when the check step failed: an alert may have gone out before a
      # later step failed, and losing that record would send it again.
      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            spc_county_alert_state_*.json
            county_*.geojson
          key: outlooker-state-${{ github.run_id }}-${{ github.run_attempt }}
