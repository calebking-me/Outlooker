; Settings for Outlooker.py when it runs on GitHub Actions
; (.github/workflows/outlooker.yml reads this file).
;
; This file is committed to the repository, which is public: never put a webhook or
; heartbeat URL here. Those come from the repository's secrets (Settings > Secrets
; and variables > Actions):
;     SLACK_ALERTS_WEBHOOK_URL   the alerts channel (required)
;     SLACK_LOGS_WEBHOOK_URL     the logs channel (optional; on when it is set)
;     OUTLOOKER_HEARTBEAT_URL    [heartbeat] url (optional)
;     OUTLOOKER_FAILURE_URL      [heartbeat] failure-url (optional)
;     SLACK_BOT_TOKEN            [alerts-channel] bot-token (for check-duplicates)
;
; Edit the settings below and commit the change; the next run uses it. Every
; setting is explained in outlooker.example.ini.

[county]
; Blank = Montgomery County, TN. Or set fips, or county with state.
fips =
county =
state =

; More counties: one [location NAME] section each, for example
; [location Work]
; county = Davidson
; state = TN

[alerts-channel]
ping = yes
report-lowered = no
; For running more instances elsewhere: see outlooker.example.ini. The bot token
; comes from the SLACK_BOT_TOKEN secret; the channel ID is not a secret.
check-duplicates = yes
channel-id = C0CKAQA1MED
duplicate-window = 24
; A link to your weather briefing page under each alert (blank = no link).
briefing-url =
briefing-text = View Latest Weather Briefing

; Alert types and thresholds. Every setting is explained in outlooker.example.ini.
[categorical]
enabled = yes
alert-level = Slight
ping-level = Enhanced
ping-days = 1, 2

[tornado]
enabled = yes
alert-probability = 5
alert-intensity = off
ping-probability = 10
ping-intensity = off
in-summary = yes

[hail]
enabled = yes
alert-probability = 30
alert-intensity = 1
ping-probability = 45
ping-intensity = 2
in-summary = no

[wind]
enabled = yes
alert-probability = 45
alert-intensity = 2
ping-probability = 60
ping-intensity = 3
in-summary = no

[heartbeat]
method = GET

[options]
; Added to the end of every Slack message from this instance, e.g. GitHub Actions.
instance-id = Github Actions
verbose = no
