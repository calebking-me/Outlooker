; Settings for Outlooker.py when it runs on GitHub Actions
; (.github/workflows/outlooker.yml reads this file).
;
; This file is committed to the repository, which is public: never put a webhook or
; heartbeat URL here. Those come from the repository's secrets (Settings > Secrets
; and variables > Actions):
;     SLACK_ALERTS_WEBHOOK_URL   the alerts channel (required)
;     SLACK_LOGS_WEBHOOK_URL     the logs channel (optional; on when it is set)
;     OUTLOOKER_HEARTBEAT_URL    [heartbeat] url (optional)
;     OUTLOOKER_FAILURE_URL      [heartbeat] failure-url (optional)
;
; Edit the settings below and commit the change; the next run uses it. Every
; setting is explained in outlooker.example.ini.

[county]
; Blank = Montgomery County, TN. Or set fips, or county with state.
fips =
county =
state =

; More counties: one [location NAME] section each, for example
; [location Work]
; county = Davidson
; state = TN

[alerts-channel]
ping = yes
report-lowered = no

[hail]
enabled = yes
alert-probability = 30
alert-intensity = 1
ping-probability = 45
ping-intensity = 2

[wind]
enabled = yes
alert-probability = 45
alert-intensity = 2
ping-probability = 75
ping-intensity = 3

[heartbeat]
method = GET

[options]
verbose = no
