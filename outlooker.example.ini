; Settings for Outlooker.py
;
; Copy this file to outlooker.ini in the same folder as Outlooker.py and fill it in.
; With outlooker.ini in place, the script needs no command-line options or
; environment variables, so a scheduled task can simply run:
;     python3 /path/to/Outlooker.py
;
; The webhook and heartbeat URLs and the bot token are secrets. Keep outlooker.ini private and out of
; version control (the repository's .gitignore already leaves it out).
;
; Command-line options win over environment variables, which win over this file.
; A blank setting uses the default. Lines starting with ; are comments.

[county]
; Leave all three blank to monitor Montgomery County, TN (FIPS 47125).
; Otherwise set either fips, or county together with state, for example:
;     fips = 47037
; or
;     county = Davidson
;     state = TN
; Not sure of the spelling? Run:  python3 Outlooker.py --list-counties --state TN
fips =
county =
state =

; To check more counties in the same run, add a [location NAME] section for each one,
; with the same settings as [county]. NAME is your own label, shown in the messages.
; Each county gets its own alerts. To use these, remove the ; from the start of the lines:
; [location Home]
; fips = 47125
;
; [location Work]
; county = Davidson
; state = TN

[alerts-channel]
; Required. The Slack Incoming Webhook URL for the alerts channel. An alert is
; posted here when a risk reaches its alert level (set in [categorical], [tornado],
; [hail] and [wind] below) and is new or has gone up since the last alert.
webhook =
; Ping the whole channel (@channel) when a risk reaches its ping level (set in the
; same sections). Set to no to never ping, whatever those sections say.
ping = yes
; Also post a message when a risk the channel was alerted about goes down: lowered,
; below the alert threshold, or removed from the outlook.
report-lowered = no
; Running the script in more than one place? Set check-duplicates = yes in each, and
; an alert another instance already posted is not posted again. It reads the alerts
; channel's recent messages, which needs a Slack app bot token (a secret, like the
; webhook) with the channels:history scope (groups:history for a private channel),
; the app invited to the channel, and the channel's ID, shown at the bottom of the
; channel's details in Slack (like C0123456789).
check-duplicates = no
bot-token =
channel-id =
; How far back to look for the same alert, in hours (default 24).
duplicate-window = 24

[logs-channel]
; Optional. Every outlook check (every normal run, not the test options) posts its
; full output here, whether or not there is anything to report. Alerts still go to
; the alerts channel.
; To turn it on, set enabled = yes and paste the logs channel's webhook URL.
enabled = no
webhook =

[categorical]
; SPC's overall severe thunderstorm risk for Days 1-3.
enabled = yes
; Alert at this risk level or higher: Marginal, Slight, Enhanced, Moderate or High
; (or 1-5). General thunderstorms counts too, as "thunderstorms".
alert-level = Slight
; Ping @channel at this level or higher ("off" never pings), on these outlook days.
ping-level = Enhanced
ping-days = 1, 2

[tornado]
; SPC's tornado outlooks for Days 1 and 2.
enabled = yes
; Alert when the chance of a tornado reaches this percent: 2, 5, 10, 15, 30, 45 or
; 60. Write "off" to alert on intensity only.
alert-probability = 5
; Alert when the tornado intensity (CIG) reaches this level, whatever the
; probability: 1 = EF2+, 2 = EF3+, 3 = EF4+ possible. "off" means the intensity is
; only shown alongside an alerting probability.
alert-intensity = off
; Ping @channel when the tornado risk reaches these ("off" never pings).
ping-probability = 10
ping-intensity = off

[hail]
; Optional. Also check SPC's hail outlooks for Days 1 and 2.
enabled = no
; Alert when the chance of hail 1 inch or larger reaches this percent: 5, 15, 30,
; 45 or 60. Write "off" to alert on intensity only.
alert-probability = 15
; Alert when the hail intensity (CIG) reaches this level, whatever the probability:
;     1 = hail 2 inches or larger possible
;     2 = hail about 3.5 inches or larger possible
; Write "off" to alert on probability only.
alert-intensity = 1
; Ping @channel when hail reaches these. Blank means hail never pings.
ping-probability =
ping-intensity =

[wind]
; Optional. Also check SPC's damaging wind outlooks for Days 1 and 2.
enabled = no
; Alert when the chance of damaging wind (gusts of 58 mph or more) reaches this
; percent: 5, 15, 30, 45 or 60. Write "off" to alert on intensity only.
alert-probability = 15
; Alert when the wind intensity (CIG) reaches this level, whatever the probability:
;     1 = gusts of 75 mph or stronger possible
;     2 = intense, organized damaging winds possible, such as a derecho
;     3 = extreme, widespread damaging winds possible
; Write "off" to alert on probability only.
alert-intensity = 1
; Ping @channel when wind reaches these. Blank means wind never pings.
ping-probability =
ping-intensity =

[heartbeat]
; Optional, for a monitoring service such as healthchecks.io, Uptime Kuma or
; Cronitor, which can warn you when the script stops running or reports a problem.
; url is requested at the end of every run, whatever happened.
url =
; failure-url is requested when something went wrong during the run. On
; healthchecks.io it is the same address with /fail added to the end.
failure-url =
; GET (the default), or POST to send the run's output along with the request.
method = GET

[options]
; A name for this copy of the script, such as Home PC or GitHub. It is added to the
; end of every Slack message it sends ("Sent by Home PC"). Blank adds nothing.
instance-id =
; Debug logging: more detail in the log file and in the logs channel posts.
verbose = no
; Where the script keeps its files. Blank means the defaults, next to Outlooker.py.
; A relative path is relative to the folder this settings file is in.
;     log-file    the log, rotated at 1 MB (default spc_county_alert.log)
;     state-file  what has already been reported (default: one file per county;
;                 can only be set when one county is checked)
;     cache-dir   folder for downloaded county outlines
log-file =
state-file =
cache-dir =
